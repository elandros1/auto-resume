[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-resume"
version = "1.4.2"
description = "Automated resume/form filler — one data source, many Word templates"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "elandros1", email = "elandros1@users.noreply.github.com"}
]
keywords = ["resume", "word", "template", "automation", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: Text Processing",
]
dependencies = [
    "python-docx>=0.8.11",
    "click>=8.0.0",
    "rich>=12.0.0",
    "Jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
auto-resume = "auto_resume.__main__:cli"

[project.urls]
Homepage = "https://github.com/elandros1/auto-resume"
Repository = "https://github.com/elandros1/auto-resume"
Issues = "https://github.com/elandros1/auto-resume/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
auto_resume = ["templates/*.docx", "samples/*.json"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
[tool.ruff.lint.per-file-ignores]
"src/auto_resume/entry.py" = ["E402", "E501"]
"src/auto_resume/__main__.py" = ["E402", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
