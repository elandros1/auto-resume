name: Build Release Assets

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest -v --tb=short
      - run: ruff check src/ tests/

  build-binaries:
    name: Build standalone executables
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pyinstaller
          pip install -e .

      - name: Build executable (Linux)
        if: runner.os == 'Linux'
        run: |
          pyinstaller --onefile --name auto-resume \
            --add-data "src/auto_resume/templates:auto_resume/templates" \
            --add-data "src/auto_resume/samples:auto_resume/samples" \
            --paths src \
            src/auto_resume/entry.py
          mv dist/auto-resume dist/auto-resume-linux

      - name: Build executable (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --onefile --name auto-resume \
            --add-data "src/auto_resume/templates:auto_resume/templates" \
            --add-data "src/auto_resume/samples:auto_resume/samples" \
            --paths src \
            src/auto_resume/entry.py
          mv dist/auto-resume dist/auto-resume-macos

      - name: Build executable (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --onefile --name auto-resume `
            --add-data "src/auto_resume/templates;auto_resume/templates" `
            --add-data "src/auto_resume/samples;auto_resume/samples" `
            --paths src `
            src/auto_resume/entry.py
          mv dist/auto-resume.exe dist/auto-resume-windows.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto-resume-${{ runner.os }}
          path: dist/auto-resume*

  release:
    name: Create GitHub Release
    needs: [build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: List artifacts
        run: find dist/ -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: ${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          files: |
            dist/auto-resume-Linux/*
            dist/auto-resume-Windows/*
            dist/auto-resume-macOS/*
